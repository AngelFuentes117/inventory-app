{% extends "base.html" %}

{% block title %}{% if action == 'add' %}Agregar Producto{% else %}Editar Producto{% endif %} - Inventario{% endblock %}

{% block content %}
<div class="card-header">
    <h2>{% if action == 'add' %}➕ Agregar Nuevo Producto{% else %}✏️ Editar Producto{% endif %}</h2>
</div>

<form method="POST" action="{{ url_for('add_product') if action == 'add' else url_for('edit_product', product_id=product.id) }}">
    <div class="form-group">
        <label for="name">Nombre *</label>
        <input type="text" id="name" name="name" value="{{ product.name if product else '' }}" required maxlength="200">
    </div>
    
    <div class="form-group">
        <label for="description">Descripción</label>
        <textarea id="description" name="description" rows="3">{{ product.description if product else '' }}</textarea>
    </div>
    
    <div class="form-row">
        <div class="form-group">
            <label for="category">Categoría *</label>
            <input type="text" id="category" name="category" value="{{ product.category if product else '' }}" required maxlength="100">
        </div>
        
        <div class="form-group">
            <label for="location">Ubicación</label>
            <input type="text" id="location" name="location" value="{{ product.location if product else '' }}" maxlength="100" placeholder="Ej: Almacén A, Estante 3">
        </div>
    </div>
    
    <div class="form-row">
        <div class="form-group">
            <label for="price">Precio *</label>
            <input type="number" id="price" name="price" step="0.01" min="0" value="{{ product.price if product else '0' }}" required>
        </div>
        
        <div class="form-group">
            <label for="quantity">Cantidad en Existencia *</label>
            <input type="number" id="quantity" name="quantity" min="0" value="{{ product.quantity if product else '0' }}" required>
        </div>
    </div>
    
    <div class="form-actions">
        <button type="submit" class="btn btn-success">{% if action == 'add' %}Guardar{% else %}Actualizar{% endif %}</button>
        <a href="{{ url_for('list_products') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
